<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 – Page Not Found · SSStyle</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>" />
  <style>
    :root {
      --bg: #0a0e1a;
      --teal: #00d4ff;
      --text: #e8eaf0;
      --muted: #8892a4;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .code {
      font-size: clamp(5rem, 20vw, 9rem);
      font-weight: 800;
      background: linear-gradient(135deg, #00d4ff, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }
    .icon { font-size: 3rem; margin: 1rem 0; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    p  { color: var(--muted); margin-bottom: 2rem; max-width: 380px; }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #00d4ff, #0090c8);
      color: #000;
      font-weight: 700;
      padding: 0.75rem 2rem;
      border-radius: 50px;
      text-decoration: none;
      transition: opacity .2s;
    }
    .btn:hover { opacity: .85; }
    .lang-btn {
      position: fixed;
      top: 1rem;
      right: 1rem;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: var(--text);
      font-weight: 700;
      font-size: 0.8rem;
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <button class="lang-btn" id="lang-btn">SK</button>
  <div class="code">404</div>
  <div class="icon">🔧</div>
  <h1 id="err-title">Page Not Found</h1>
  <p id="err-desc">Looks like this page needs a repair too. Let's get you back on track.</p>
  <a class="btn" href="/" id="err-btn">← Back to Home</a>

  <script>
    const STRINGS = {
      en: { title: 'Page Not Found', desc: "Looks like this page needs a repair too. Let's get you back on track.", btn: '← Back to Home' },
      sk: { title: 'Stránka nenájdená', desc: 'Zdá sa, že táto stránka tiež potrebuje opravu. Vráťme vás späť.', btn: '← Späť na hlavnú stránku' },
    };
    let lang = 'en';
    try { lang = localStorage.getItem('fixphone-lang') || 'en'; } catch (_) {}
    if (!STRINGS[lang]) lang = 'en';

    function applyLang() {
      const s = STRINGS[lang];
      document.getElementById('err-title').textContent = s.title;
      document.getElementById('err-desc').textContent  = s.desc;
      document.getElementById('err-btn').textContent   = s.btn;
      document.getElementById('lang-btn').textContent  = lang === 'en' ? 'SK' : 'EN';
      document.documentElement.lang = lang;
    }

    document.getElementById('lang-btn').addEventListener('click', () => {
      lang = lang === 'en' ? 'sk' : 'en';
      try { localStorage.setItem('fixphone-lang', lang); } catch (_) {}
      applyLang();
    });

    applyLang();
  </script>
</body>
</html>
